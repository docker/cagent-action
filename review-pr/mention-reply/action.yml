name: "PR Review — Mention Reply"
description: "Replies to @svc-docker-agent mentions in PR issue comments"
author: "Docker"

inputs:
  mention-context:
    description: "Formatted prompt containing PR context and the mention comment"
    required: true
  anthropic-api-key:
    description: "Anthropic API key"
    required: false
  openai-api-key:
    description: "OpenAI API key"
    required: false
  google-api-key:
    description: "Google API key for Gemini models"
    required: false
  aws-bearer-token-bedrock:
    description: "AWS Bearer token for Bedrock models"
    required: false
  xai-api-key:
    description: "xAI API key for Grok models"
    required: false
  nebius-api-key:
    description: "Nebius API key"
    required: false
  mistral-api-key:
    description: "Mistral API key"
    required: false
  github-token:
    description: "GitHub token for posting replies"
    required: false
  skip-auth:
    description: "Skip the built-in authorization check (caller already verified auth)"
    required: false
    default: "false"

outputs:
  agent-outcome:
    description: "Outcome of the mention reply agent (success/failure)"
    value: ${{ steps.run-reply.outcome }}

runs:
  using: "composite"
  steps:
    - name: Ensure cache directory exists
      shell: bash
      run: mkdir -p .cache

    - name: Restore reply memory
      uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
      with:
        path: .cache/pr-review-memory.db
        key: pr-review-memory-${{ github.repository }}-mention-reply-${{ github.run_id }}
        restore-keys: |
          pr-review-memory-${{ github.repository }}-mention-reply-
          pr-review-memory-${{ github.repository }}-

    - name: Run mention reply
      id: run-reply
      continue-on-error: true
      uses: docker/cagent-action@2369328cd25777eb0a4ff959a399b6d1a5204fc7 # v1.4.4
      env:
        ACTION_PATH: ${{ github.action_path }}
      with:
        agent: ${{ env.ACTION_PATH }}/../agents/pr-review-mention-reply.yaml
        prompt: ${{ inputs.mention-context }}
        timeout: "120"
        anthropic-api-key: ${{ inputs.anthropic-api-key }}
        openai-api-key: ${{ inputs.openai-api-key }}
        google-api-key: ${{ inputs.google-api-key }}
        aws-bearer-token-bedrock: ${{ inputs.aws-bearer-token-bedrock }}
        xai-api-key: ${{ inputs.xai-api-key }}
        nebius-api-key: ${{ inputs.nebius-api-key }}
        mistral-api-key: ${{ inputs.mistral-api-key }}
        github-token: ${{ inputs.github-token }}
        skip-summary: "true"
        skip-auth: ${{ inputs.skip-auth }}

    - name: Save reply memory
      if: always()
      continue-on-error: true
      uses: actions/cache/save@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
      with:
        path: .cache/pr-review-memory.db
        key: pr-review-memory-${{ github.repository }}-mention-reply-${{ github.run_id }}
