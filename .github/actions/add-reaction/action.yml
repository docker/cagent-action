name: 'Add Reaction'
description: 'Post a reaction emoji on a GitHub issue comment'
inputs:
  github-token:
    description: 'GitHub token with reactions:write permission'
    required: true
  owner:
    description: 'Repository owner'
    required: true
  repo:
    description: 'Repository name'
    required: true
  comment-id:
    description: 'ID of the issue comment to react to'
    required: true
  content:
    description: "Reaction content: +1, -1, laugh, confused, heart, hooray, rocket, eyes"
    required: false
    default: 'eyes'
runs:
  using: 'node20'
  main: '../../../dist/add-reaction.js'
