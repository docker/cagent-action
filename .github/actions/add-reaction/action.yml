name: 'Add Reaction'
description: 'Post a reaction emoji on a GitHub issue comment'
inputs:
  github-token:
    description: 'GitHub token with reactions:write permission'
    required: true
  owner:
    description: 'Repository owner'
    required: true
  repo:
    description: 'Repository name'
    required: true
  comment-id:
    description: 'ID of the issue comment to react to'
    required: true
  content:
    description: "Reaction content: +1, -1, laugh, confused, heart, hooray, rocket, eyes"
    required: false
    default: 'eyes'
runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: '24'
    - name: Add reaction
      shell: bash
      env:
        GITHUB_APP_TOKEN: ${{ inputs.github-token }}
        INPUT_OWNER: ${{ inputs.owner }}
        INPUT_REPO: ${{ inputs.repo }}
        INPUT_COMMENT-ID: ${{ inputs.comment-id }}
        INPUT_CONTENT: ${{ inputs.content }}
      run: node "$GITHUB_ACTION_PATH/../../../dist/add-reaction.js"
