name: 'Get PR Metadata'
description: 'Fetch title, description, author, and base branch for a pull request'
inputs:
  github-token:
    description: 'GitHub token with contents:read permission'
    required: true
  owner:
    description: 'Repository owner'
    required: true
  repo:
    description: 'Repository name'
    required: true
  pr-number:
    description: 'Pull request number'
    required: true
outputs:
  title:
    description: 'PR title'
  body:
    description: 'PR description body'
  author-login:
    description: 'Login of the PR author'
  base-ref-name:
    description: 'Target base branch name'
runs:
  using: 'node20'
  main: '../../../dist/get-pr-meta.js'
