name: 'Post Comment'
description: 'Create a comment on a GitHub issue or pull request'
inputs:
  github-token:
    description: 'GitHub token with issues:write permission'
    required: true
  owner:
    description: 'Repository owner'
    required: true
  repo:
    description: 'Repository name'
    required: true
  issue-number:
    description: 'Issue or pull request number'
    required: true
  body:
    description: 'Comment body (Markdown supported)'
    required: true
runs:
  using: 'node20'
  main: '../../../dist/post-comment.js'
