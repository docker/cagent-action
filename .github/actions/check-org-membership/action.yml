name: 'Check Org Membership'
description: 'Verify whether a GitHub user is a member of an organisation'
inputs:
  org-membership-token:
    description: 'PAT or app token with read:org scope'
    required: true
  org:
    description: 'GitHub organisation name'
    required: true
  username:
    description: 'GitHub username to check'
    required: true
outputs:
  is-member:
    description: "'true' if the user is an org member, 'false' otherwise"
runs:
  using: 'node20'
  main: '../../../dist/check-org-membership.js'
