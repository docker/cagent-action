name: 'Check Org Membership'
description: 'Verify whether a GitHub user is a member of an organisation'
inputs:
  org-membership-token:
    description: 'PAT or app token with read:org scope'
    required: true
  org:
    description: 'GitHub organisation name'
    required: true
  username:
    description: 'GitHub username to check'
    required: true
outputs:
  is-member:
    description: "'true' if the user is an org member, 'false' otherwise"
    value: ${{ steps.check.outputs.is-member }}
runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: '24'
    - name: Check membership
      id: check
      shell: bash
      env:
        ORG_MEMBERSHIP_TOKEN: ${{ inputs.org-membership-token }}
        INPUT_ORG: ${{ inputs.org }}
        INPUT_USERNAME: ${{ inputs.username }}
      run: node "$GITHUB_ACTION_PATH/../../../dist/check-org-membership.js"
